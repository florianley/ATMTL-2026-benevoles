# ATMTL 2026 · Bénévoles — configuration Nginx pour Cloud Run
# Cloud Run route le trafic vers le port 8080 : Nginx écoute en dur dessus.

server {
    listen      8080;
    listen      [::]:8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    # ---------------------------------------------------------------
    # Compression
    # ---------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   512;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml;

    # ---------------------------------------------------------------
    # En-têtes de sécurité (hérités par tous les blocs sans add_header)
    # ---------------------------------------------------------------
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # ---------------------------------------------------------------
    # Application : le HTML est toujours revalidé pour propager
    # immédiatement les mises à jour du planning.
    # ---------------------------------------------------------------
    location = /index.html {
        expires -1;
        try_files $uri =404;
    }

    location = / {
        expires -1;
        try_files /index.html =404;
    }

    # ---------------------------------------------------------------
    # Service worker : jamais mis en cache (sinon les mises à jour
    # de l'application restent bloquées).
    # ---------------------------------------------------------------
    location = /sw.js {
        # Pas de `expires` ici : il ajouterait un second en-tête Cache-Control.
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ---------------------------------------------------------------
    # Assets statiques : cache long (les fichiers sont versionnés
    # par déploiement, le HTML ci-dessus gère la fraîcheur).
    # ---------------------------------------------------------------
    location ~* \.(?:css|js|mjs|json|webmanifest|svg|png|jpe?g|webp|avif|ico|woff2?)$ {
        # En-tête explicite (pas de `expires`, qui ajouterait un doublon).
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # ---------------------------------------------------------------
    # Sonde de santé (Cloud Run / docker HEALTHCHECK)
    # ---------------------------------------------------------------
    location = /healthz {
        access_log   off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    # ---------------------------------------------------------------
    # Repli SPA
    # ---------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /index.html;
}
